<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .teal { fill: #2C7178; }
      .red { fill: #B0413E; }
      .stroke-teal { stroke: #2C7178; fill: none; }
    </style>
  </defs>

  <!-- Outer circle ring -->
  <circle cx="100" cy="100" r="92" class="stroke-teal" stroke-width="1.8"/>

  <!-- Intercardinal tick marks (NE, SE, SW, NW) -->
  <line x1="161.5" y1="38.5" x2="153" y2="47" class="stroke-teal" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="161.5" y1="161.5" x2="153" y2="153" class="stroke-teal" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="38.5" y1="161.5" x2="47" y2="153" class="stroke-teal" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="38.5" y1="38.5" x2="47" y2="47" class="stroke-teal" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Secondary intercardinal ticks -->
  <line x1="133.5" y1="16" x2="129" y2="25" class="stroke-teal" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="184" y1="66.5" x2="175" y2="71" class="stroke-teal" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="184" y1="133.5" x2="175" y2="129" class="stroke-teal" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="133.5" y1="184" x2="129" y2="175" class="stroke-teal" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="66.5" y1="184" x2="71" y2="175" class="stroke-teal" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="16" y1="133.5" x2="25" y2="129" class="stroke-teal" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="16" y1="66.5" x2="25" y2="71" class="stroke-teal" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="66.5" y1="16" x2="71" y2="25" class="stroke-teal" stroke-width="0.9" stroke-linecap="round"/>

  <!-- North arrow (red - accent) -->
  <polygon points="100,18 111,80 100,68 89,80" class="red"/>

  <!-- South arrow (teal) -->
  <polygon points="100,182 111,120 100,132 89,120" class="teal"/>

  <!-- East arrow (teal) -->
  <polygon points="182,100 120,89 132,100 120,111" class="teal"/>

  <!-- West arrow (teal) -->
  <polygon points="18,100 80,89 68,100 80,111" class="teal"/>

  <!-- Thin inner decorative lines -->
  <line x1="128" y1="72" x2="72" y2="128" class="stroke-teal" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <line x1="72" y1="72" x2="128" y2="128" class="stroke-teal" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

  <!-- Inner circle ring -->
  <circle cx="100" cy="100" r="16" class="stroke-teal" stroke-width="1.4"/>

  <!-- Red center dot -->
  <circle cx="100" cy="100" r="5" class="red"/>
</svg>